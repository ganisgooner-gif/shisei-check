<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>姿勢タイプ診断 | かみふくろう整骨院・整体院</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f8f7f4;font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans',Meiryo,sans-serif;color:#1a1a1a;min-height:100vh;padding:20px 16px 40px}
#app{max-width:420px;margin:0 auto}
.hidden{display:none!important}

/* START */
.card{background:#fff;border:1px solid #e8e6e0;border-radius:16px;padding:20px;margin-bottom:14px}
.start-title{font-size:22px;font-weight:700;color:#1a1a1a;margin-bottom:10px;text-align:center}
.divider{height:1px;background:#e8e6e0;margin-bottom:14px}
.start-lead{font-size:14px;font-weight:600;color:#1a1a1a;margin-bottom:6px;line-height:1.6}
.start-sub{font-size:13px;color:#666;line-height:1.7;margin-bottom:16px}
.pill-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;justify-content:center}
.pill{display:inline-block;font-size:12px;padding:4px 12px;border-radius:20px;font-weight:500}
.pill-fwd{background:#EEEDFE;color:#3C3489}
.pill-lr{background:#E1F5EE;color:#085041}
.pill-chest{background:#FAECE7;color:#712B13}
.time-note{font-size:12px;color:#999;margin-bottom:18px;text-align:center}
.start-btn{width:100%;padding:14px;background:#7F77DD;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;letter-spacing:0.04em;transition:background 0.2s}
.start-btn:hover{background:#534AB7}

/* QUIZ */
.prog-wrap{margin-bottom:20px}
.prog-track{height:5px;background:#e0dff5;border-radius:3px;overflow:hidden}
.prog-fill{height:5px;background:#7F77DD;border-radius:3px;transition:width 0.3s}
.prog-meta{display:flex;justify-content:space-between;font-size:12px;color:#999;margin-top:6px}
.axis-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;margin-bottom:14px}
.q-text{font-size:17px;font-weight:600;color:#1a1a1a;line-height:1.65;margin-bottom:22px;min-height:56px}
.choices{display:flex;flex-direction:column;gap:9px}
.choice-btn{display:flex;align-items:center;gap:12px;padding:13px 16px;background:#fff;border:1px solid #e0dff5;border-radius:10px;cursor:pointer;width:100%;text-align:left;transition:background 0.15s,border-color 0.15s}
.choice-btn:hover{background:#f5f4fd;border-color:#AFA9EC}
.choice-num{width:30px;height:30px;border-radius:50%;background:#EEEDFE;color:#3C3489;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.choice-lbl{font-size:14px;color:#1a1a1a}

/* RESULT */
.result-header{text-align:center;padding:22px 16px 18px}
.type-tag{display:inline-block;font-size:12px;font-weight:600;padding:4px 14px;border-radius:20px;margin-bottom:10px}
.type-name{font-size:22px;font-weight:700;color:#1a1a1a;margin-bottom:5px}
.type-sub{font-size:13px;color:#666}
.sec-label{font-size:12px;font-weight:600;color:#999;margin-bottom:12px;text-transform:uppercase;letter-spacing:0.05em}
.bar-row{margin-bottom:12px}
.bar-meta{display:flex;justify-content:space-between;font-size:13px;color:#555;margin-bottom:5px}
.bar-val{font-weight:700;color:#1a1a1a}
.bar-bg{height:9px;background:#f0efe8;border-radius:5px;overflow:hidden}
.bar-inner{height:9px;border-radius:5px;transition:width 0.6s ease}
.pillar-label{font-size:12px;font-weight:600;color:#999;margin-bottom:10px;text-transform:uppercase;letter-spacing:0.05em}
.pillar-row{display:flex;gap:7px}
.pillar-chip{flex:1;padding:10px 6px;border-radius:10px;text-align:center;font-size:11px;font-weight:600;border:1px solid;line-height:1.4}
.pillar-chip-sub{font-size:10px;font-weight:400;margin-top:3px;opacity:0.75}
.pillar-on{background:#EEEDFE;color:#3C3489;border-color:#AFA9EC}
.pillar-off{background:#f5f5f2;color:#aaa;border-color:#e5e3da}
.dt-label{font-size:12px;font-weight:600;color:#999;margin-bottom:7px;margin-top:14px;text-transform:uppercase;letter-spacing:0.05em}
.dt-item{font-size:14px;color:#333;line-height:1.65;padding-left:14px;position:relative;margin-bottom:4px}
.dt-item::before{content:"•";position:absolute;left:0;color:#7F77DD}
.ac-card{background:#EEEDFE;border:1px solid #AFA9EC;border-radius:16px;padding:18px;margin-bottom:14px}
.ac-label{font-size:12px;font-weight:600;color:#3C3489;margin-bottom:10px;text-transform:uppercase;letter-spacing:0.05em}
.ac-item{font-size:14px;color:#26215C;line-height:1.65;padding-left:16px;position:relative;margin-bottom:5px}
.ac-item::before{content:"→";position:absolute;left:0;color:#7F77DD;font-weight:700}
.cta-card{background:#7F77DD;border-radius:16px;padding:20px;margin-bottom:14px}
.cta-title{font-size:16px;font-weight:700;color:#fff;margin-bottom:7px}
.cta-sub{font-size:13px;color:#CECBF6;line-height:1.65;margin-bottom:16px}
.cta-btn-line{display:block;width:100%;padding:14px;background:#fff;color:#534AB7;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;margin-bottom:9px}
.cta-btn-session{display:block;width:100%;padding:12px;background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,0.45);border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;text-align:center;text-decoration:none}
.retry-btn{width:100%;padding:12px;background:transparent;border:1px solid #d0cfc8;border-radius:10px;font-size:14px;color:#999;cursor:pointer;margin-bottom:32px}
</style>
</head>
<body>
<div id="app">

  <!-- START -->
  <div id="scr-start">
    <div class="card">
      <div class="start-title">姿勢タイプ診断</div>
      <div class="divider"></div>
      <div class="start-lead">体の知識がなくても、あなただけの姿勢グセを見つけられます</div>
      <div class="start-sub">前後・左右・胸郭の3軸から、あなたの姿勢グセを分析します。</div>
      <div class="pill-row">
        <span class="pill pill-fwd">前後バランス</span>
        <span class="pill pill-lr">左右バランス</span>
        <span class="pill pill-chest">胸郭・呼吸</span>
      </div>
      <div class="time-note">所要時間：約2〜3分 / 全15問</div>
      <button class="start-btn" id="btn-start">診断をはじめる</button>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="scr-quiz" class="hidden">
    <div class="prog-wrap">
      <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
      <div class="prog-meta"><span id="prog-num">1 / 15</span><span id="prog-axis-label"></span></div>
    </div>
    <div id="axis-badge-wrap"></div>
    <div class="q-text" id="q-text"></div>
    <div class="choices" id="choices"></div>
  </div>

  <!-- RESULT -->
  <div id="scr-result" class="hidden">
    <div class="card result-header" id="res-header"></div>
    <div class="card" id="res-scores"></div>
    <div class="card" id="res-pillar"></div>
    <div class="card" id="res-detail"></div>
    <div class="ac-card" id="res-actions"></div>
    <div class="cta-card">
      <div class="cta-title">より具体的な姿勢評価を受けて、本格的に改善してみませんか？</div>
      <div class="cta-sub">初回60分の体験セッションで、あなたの姿勢タイプに合わせた改善プランを作成します。LINEから24時間予約できます。</div>
      <a class="cta-btn-line" href="https://lin.ee/sEE0swO" target="_blank">初回体験セッションを予約する（4,980円）</a>
      <a class="cta-btn-session" href="https://kamifukurou.com" target="_blank">かみふくろう整骨院・整体院のホームページ</a>
    </div>
    <button class="retry-btn" id="btn-retry">もう一度診断する</button>
  </div>

</div>
<script>
(function(){
var QS=[
  {axis:'fwd',text:'壁に立つと、腰に手がスッと入りやすい'},
  {axis:'fwd',text:'立つと肋骨が前に開きやすい（上に飛び出す感じがある）'},
  {axis:'fwd',text:'座るとすぐ骨盤が後ろに倒れて猫背になる'},
  {axis:'fwd',text:'背中を丸める→伸ばすの動きが硬いと感じる'},
  {axis:'fwd',text:'長時間立つと腰が重くなる、または反ると痛い'},
  {axis:'lr',text:'片脚立ちで、左右どちらかだけ極端にふらつく'},
  {axis:'lr',text:'肩の高さが左右で違うと言われる、または写真で気になる'},
  {axis:'lr',text:'立ったとき、どちらか片方の足に体重が偏る'},
  {axis:'lr',text:'歩くと、片側の脚だけ疲れやすい・張りやすい'},
  {axis:'lr',text:'バッグをいつも同じ側で持つクセがある'},
  {axis:'chest',text:'深呼吸しても胸が大きく動かない（胸郭が広がらない）'},
  {axis:'chest',text:'肩で息をしてしまう、首が疲れやすい'},
  {axis:'chest',text:'呼吸が浅くて疲れやすい、集中できないと感じる'},
  {axis:'chest',text:'背中（胸椎）の丸まり→伸ばしが硬い'},
  {axis:'chest',text:'寝ても疲れが取れにくい'}
];
var CHOICES=[
  {v:5,l:'よく当てはまる'},
  {v:4,l:'やや当てはまる'},
  {v:3,l:'どちらともいえない'},
  {v:2,l:'あまり当てはまらない'},
  {v:1,l:'当てはまらない'}
];
var AXIS={
  fwd:{name:'前後バランス',bg:'#EEEDFE',col:'#3C3489'},
  lr:{name:'左右バランス',bg:'#E1F5EE',col:'#085041'},
  chest:{name:'胸郭・呼吸',bg:'#FAECE7',col:'#712B13'}
};
var TYPES={
  A:{name:'前後バランス崩れタイプ',sub:'反り腰・骨盤後傾',tbg:'#EEEDFE',tcol:'#3C3489',
    pillars:['spine','ham'],
    feat:['反り腰または猫背になりやすい','腰が重く、立っていると疲れやすい','腰に負担が集中しやすい'],
    risk:['腰痛・背中のつっぱり','椎間板へのストレス増加','股関節・膝への負担'],
    act:['背骨を丸める→伸ばすを毎朝10回繰り返す','骨盤を立てた座り方を意識する','体幹インナーを意識した動きを習慣にする']},
  B:{name:'胸郭固まりタイプ',sub:'猫背・呼吸制限',tbg:'#FAECE7',tcol:'#712B13',
    pillars:['chest','spine'],
    feat:['姿勢が丸まりやすく、肩が内側に入る','肩で息をしてしまう','集中しにくく疲れやすい'],
    risk:['肩こり・首こり・背中の張り','猫背の固定・椎間関節への負担','腰椎への連鎖的な負担'],
    act:['360°に息を入れる胸郭呼吸を練習する','胸を開く姿勢で1日5分過ごす','呼吸から体幹が自然に働く状態をつくる']},
  C:{name:'左右アンバランスタイプ',sub:'ねじれ・荷重差',tbg:'#E1F5EE',tcol:'#085041',
    pillars:['ham','spine'],
    feat:['片脚立ちの安定に左右差がある','肩・腰の高さに左右差がある','立ったとき体が片側に寄る'],
    risk:['片側だけの腰痛・肩こり','股関節・膝の変性が進みやすい','坐骨神経痛が出やすくなる'],
    act:['ハムストリングスを左右均等にほぐす','片側に寄る立ち方・歩き方を意識する','左右の荷重バランスを整える動きを習慣にする']},
  D:{name:'全体疲労タイプ',sub:'背骨・骨盤・胸郭すべてに制限',tbg:'#F1EFE8',tcol:'#444441',
    pillars:['spine','ham','chest'],
    feat:['全身が何となく重い・だるい','姿勢が長く続かない','力の入りどころがわからない'],
    risk:['慢性疲労・腰痛・肩こり','全体的な関節負荷の蓄積','慢性的な頸部痛・腰痛の固定化'],
    act:['三本柱を少しずつ毎日整える','背骨・ハム・胸郭をほぐすことから始める','専門家のサポートのもと段階的に改善する']}
};
var PILLARS={
  spine:{label:'背骨のしなやかさ',sub:'姿勢の根本'},
  ham:{label:'ハムストリングスのゆとり',sub:'骨盤の自由度'},
  chest:{label:'胸郭のひろがり',sub:'呼吸の質'}
};
var PILLAR_KEYS=['spine','ham','chest'];
var cur=0,sc={fwd:[],lr:[],chest:[]};

function el(id){return document.getElementById(id);}
function show(id){
  ['scr-start','scr-quiz','scr-result'].forEach(function(s){
    el(s).classList[s===id?'remove':'add']('hidden');
  });
  window.scrollTo(0,0);
}
function avg(arr){
  if(!arr.length)return 0;
  return arr.reduce(function(a,b){return a+b;},0)/arr.length;
}

el('btn-start').addEventListener('click',function(){
  cur=0;sc={fwd:[],lr:[],chest:[]};
  show('scr-quiz');renderQ();
});
el('btn-retry').addEventListener('click',function(){
  cur=0;sc={fwd:[],lr:[],chest:[]};
  show('scr-quiz');renderQ();
});

function renderQ(){
  var q=QS[cur];
  el('prog-fill').style.width=Math.round((cur/15)*100)+'%';
  el('prog-num').textContent=(cur+1)+' / 15';
  var ai=AXIS[q.axis];
  el('prog-axis-label').textContent=ai.name;
  el('axis-badge-wrap').innerHTML='<span class="axis-badge" style="background:'+ai.bg+';color:'+ai.col+'">'+ai.name+'</span>';
  el('q-text').textContent=q.text;
  var wrap=el('choices');
  wrap.innerHTML='';
  CHOICES.forEach(function(c){
    var b=document.createElement('button');
    b.className='choice-btn';
    b.innerHTML='<span class="choice-num">'+c.v+'</span><span class="choice-lbl">'+c.l+'</span>';
    b.addEventListener('click',function(){answer(c.v);});
    wrap.appendChild(b);
  });
}

function answer(val){
  sc[QS[cur].axis].push(val);
  cur++;
  if(cur>=15){showResult();}else{renderQ();}
}

function showResult(){
  var fa=avg(sc.fwd),la=avg(sc.lr),ca=avg(sc.chest);
  var type;
  if(fa>=3&&la>=3&&ca>=3&&(fa+la+ca)>=10){type='D';}
  else{
    var max=Math.max(fa,la,ca);
    type=fa===max?'A':ca===max?'B':'C';
  }
  var t=TYPES[type];

  el('res-header').innerHTML=
    '<span class="type-tag" style="background:'+t.tbg+';color:'+t.tcol+'">タイプ '+type+'</span>'+
    '<div class="type-name">'+t.name+'</div>'+
    '<div class="type-sub">'+t.sub+'</div>';

  var axes=[
    {name:'前後バランス',val:fa,col:'#7F77DD'},
    {name:'左右バランス',val:la,col:'#1D9E75'},
    {name:'胸郭・呼吸',val:ca,col:'#D85A30'}
  ];
  var sh='<div class="sec-label">3軸スコア</div>';
  axes.forEach(function(a){
    var pct=Math.round((a.val/5)*100);
    sh+='<div class="bar-row">'+
      '<div class="bar-meta"><span>'+a.name+'</span><span class="bar-val">'+a.val.toFixed(1)+'</span></div>'+
      '<div class="bar-bg"><div class="bar-inner" style="width:'+pct+'%;background:'+a.col+'"></div></div>'+
      '</div>';
  });
  el('res-scores').innerHTML=sh;

  var ph='<div class="pillar-label">改善の優先ポイント（かみふくろう式三本柱）</div><div class="pillar-row">';
  PILLAR_KEYS.forEach(function(k){
    var on=t.pillars.indexOf(k)!==-1;
    var p=PILLARS[k];
    ph+='<div class="pillar-chip '+(on?'pillar-on':'pillar-off')+'">'+p.label+'<div class="pillar-chip-sub">'+p.sub+'</div></div>';
  });
  ph+='</div>';
  el('res-pillar').innerHTML=ph;

  var dh='<div class="dt-label">特徴</div>';
  t.feat.forEach(function(f){dh+='<div class="dt-item">'+f+'</div>';});
  dh+='<div class="dt-label">起こりやすい不調</div>';
  t.risk.forEach(function(r){dh+='<div class="dt-item">'+r+'</div>';});
  el('res-detail').innerHTML=dh;

  var ah='<div class="ac-label">今日からできること</div>';
  t.act.forEach(function(a){ah+='<div class="ac-item">'+a+'</div>';});
  el('res-actions').innerHTML=ah;

  show('scr-result');
}
})();
</script>
</body>
</html>
