<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>姿勢タイプチェック | かみふくろう整骨院・整体院</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --brown:#96735A;--brown-d:#6E5340;--salmon:#E8917A;
  --kinari:#FAF6F1;--line:#EADFD4;--line-green:#06C755;
  --text:#4A3B30;--sub:#8A7868;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--kinari)}
body{font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;font-weight:500;color:var(--text);min-height:100vh;padding:12px 10px 16px}
body.is-start{display:flex;flex-direction:column;justify-content:center}
#app{width:100%;max-width:420px;margin:0 auto}
.hidden{display:none!important}
body.is-embed .btn-hp{display:none}
body.is-embed{padding-bottom:8px}

.head{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:700;color:var(--brown-d);letter-spacing:.04em;margin:0 4px 10px}
.head img{width:26px;height:auto;display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 14px}

/* START */
.start-lead{font-size:16px;font-weight:700;color:var(--brown-d);line-height:1.6;margin-bottom:8px}
.start-sub{font-size:13px;color:var(--sub);line-height:1.8;margin-bottom:16px}
.pill-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:14px}
.pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;border:1px solid}
.pill-a{background:#FBE9E3;color:#B5583F;border-color:#F3C9BC}
.pill-b{background:#F4ECE4;color:var(--brown-d);border-color:#E2D2C3}
.pill-c{background:#E6F3EE;color:#2F7A5F;border-color:#C6E3D7}
.time-note{font-size:12px;color:var(--sub);text-align:center;margin-bottom:16px}
.main-btn{display:block;width:100%;padding:14px;background:var(--brown);color:#fff;border:none;border-radius:999px;font:inherit;font-size:16px;font-weight:700;letter-spacing:.04em;cursor:pointer}
.main-btn:active{background:var(--brown-d)}

/* QUIZ */
.prog-track{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog-fill{height:6px;background:var(--salmon);border-radius:3px;transition:width .3s}
.prog-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin:6px 0 18px}
.q-text{font-size:17px;font-weight:700;color:var(--brown-d);line-height:1.7;text-align:center;min-height:58px;margin-bottom:20px}
.choices{display:flex;flex-direction:column;gap:9px}
.choice-btn{display:block;width:100%;padding:13px 16px;background:#fff;border:1.5px solid var(--line);border-radius:999px;font:inherit;font-size:15px;color:var(--text);text-align:center;cursor:pointer;transition:background .15s,border-color .15s}
.choice-btn:active,.choice-btn.picked{background:#FBE9E3;border-color:var(--salmon)}
.back-btn{display:block;margin:16px auto 0;padding:9px 18px;background:#fff;border:1px solid var(--line);border-radius:999px;font:inherit;font-size:13px;color:var(--sub);cursor:pointer}

/* RESULT */
.res-title{font-size:16px;font-weight:700;color:var(--brown-d);text-align:center;margin-bottom:10px}
.res-card{display:flex;align-items:center;gap:clamp(10px,3.5vw,16px);background:var(--brown-d);color:#fff;border-radius:18px;padding:14px;margin-bottom:12px}
.type-pic{flex:0 0 auto;width:clamp(70px,22vw,90px);border-radius:12px;overflow:hidden;background:var(--kinari)}
.type-pic img{display:block;width:100%;height:auto}
.type-side{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.type-name{word-break:keep-all;font-size:clamp(19px,6.4vw,27px);font-weight:700;line-height:1.3;color:#FFD3C6;letter-spacing:.02em;margin-bottom:8px}
.type-desc{word-break:keep-all;font-size:clamp(14px,4.4vw,18px);font-weight:700;line-height:1.55;margin-bottom:10px}
.chips{display:flex;flex-direction:column;align-items:center;gap:6px}
.chip{word-break:keep-all;font-size:clamp(12.5px,3.6vw,15px);font-weight:700;line-height:1.45;padding:5px 11px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff}
.chip small{display:block;font-size:.82em;font-weight:500;opacity:.85}
.cta-title{word-break:keep-all;font-size:15px;font-weight:700;color:var(--brown-d);text-align:center;margin-bottom:10px}
.caution{word-break:keep-all;font-size:11px;color:var(--sub);line-height:1.6;text-align:center;margin:0 0 12px}
.btn-line{display:block;width:100%;padding:12px 8px;background:var(--line-green);color:#fff;border-radius:999px;font-size:15px;font-weight:700;text-align:center;text-decoration:none;white-space:nowrap;margin-bottom:9px}
.btn-line .price{display:block;font-size:12.5px;margin-top:1px}
@media (max-width:340px){.btn-line{font-size:14px}}
.btn-hp{display:block;width:100%;padding:11px;background:#fff;color:var(--brown-d);border:1.5px solid var(--brown);border-radius:999px;font-size:14px;font-weight:700;text-align:center;text-decoration:none;margin-top:12px}
.retry-btn{display:block;margin:2px auto 0;padding:6px 12px;background:none;border:none;font:inherit;font-size:13px;color:var(--sub);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
</style>
</head>

};
var SIDE_NAME={R:'右',L:'左'};
var cur=0,ans=[];

function el(id){return document.getElementById(id);}
function show(id){
  ['scr-start','scr-quiz','scr-result'].forEach(function(s){
    el(s).classList[s===id?'remove':'add']('hidden');
  });
  document.body.classList[id==='scr-start'?'add':'remove']('is-start');
  window.scrollTo(0,0);
}
function startQuiz(){cur=0;ans=[];show('scr-quiz');renderQ();}

el('btn-start').addEventListener('click',startQuiz);
el('btn-retry').addEventListener('click',startQuiz);
el('btn-back').addEventListener('click',function(){
  if(cur>0){cur--;renderQ();}
});

function renderQ(){
  var q=QS[cur];
  el('prog-fill').style.width=Math.round((cur/N)*100)+'%';
  el('prog-num').textContent=(cur+1)+' / '+N;
  el('prog-sec').textContent=SEC[q.sec];
  el('q-text').textContent=q.text;
  var wrap=el('choices');
  wrap.innerHTML='';
  (q.kind==='f'?FREQ:SIDE).forEach(function(c){
    var b=document.createElement('button');
    b.className='choice-btn'+(ans[cur]===c.v?' picked':'');
    b.textContent=c.l;
    b.addEventListener('click',function(){answer(c.v);});
    wrap.appendChild(b);
  });
  el('btn-back').classList[cur>0?'remove':'add']('hidden');
}

function answer(v){
  ans[cur]=v;
  cur++;
  if(cur>=N){showResult();}else{renderQ();}
}

function judge(a){
  var d=(a[0]+a[1])-(a[2]+a[3]);
  var dir=d>=2?'f':(d<=-2?'b':'c');
  var roll=(a[4]+a[5]+a[6])>=4?'strong':'weak';
  var lean=(a[7]===a[8]&&a[7]!=='N')?a[7]:null;
  var twist=(a[9]==='R'||a[9]==='L')?a[9]:null;
  return {key:dir+'-'+roll,lean:lean,twist:twist};
}

function showResult(){
  var r=judge(ans);
  var t=TYPES[r.key];
  el('res-name').innerHTML=t.name;
  el('res-desc').innerHTML=t.desc;
  el('res-pic').src=t.pic;
  var c=[];
  c.push(r.lean?SIDE_NAME[r.lean]+'足に<wbr>体重が<wbr>のりやすい':'左右の偏りは<wbr>少なめ');
  if(r.twist){c.push(SIDE_NAME[r.twist]+'肩が<wbr>下がりやすい<small>（ねじれのくせ）</small>');}
  el('res-chips').innerHTML=c.map(function(x){return '<span class="chip">'+x+'</span>';}).join('');
  show('scr-result');
}

window.__judge=judge;
})();
</script>
